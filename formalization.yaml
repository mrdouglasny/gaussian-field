status:
  scope: >
    A Mathlib library for Gaussian measures on duals of nuclear Frechet spaces.
    Core pieces: (1) nuclearity of the Schwartz space via the Dynin-Mityagin
    rapid-decay characterization; (2) a nuclear tensor product of nuclear spaces
    with its universal property (kernel theorem) and functoriality; (3) the
    construction of a centered Gaussian measure on E' from a CLM T : E -> H with
    characteristic functional exp(-||T f||^2/2), its Gaussianity and a support
    theorem under Hilbert-Schmidt T; (4) Nelson hypercontractivity; (5) lattice
    field-theory infrastructure: FKG inequality, lattice->continuum convergence
    of the Green's function, and Green's-function invariances.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - embed_l2_uniform_bound                  # Cylinder/MethodOfImages.lean
    - fourierMultiplier_schwartz_bound        # SchwartzFourier/ResolventUniformBound.lean
    - hermiteGalerkinTrunc_tendsto_schwartz   # SchwartzNuclear/HermiteGalerkin.lean
  main_results:
    # --- nuclear spaces + tensor product (the structural core) ---
    - declaration: "GaussianField.schwartz_dyninMityaginSpace"
      file: "SchwartzNuclear/HermiteNuclear.lean"
      sorry_count: 0
      literature_dependencies:
        - statement: "the Schwartz space S(R^d) is a nuclear (Dynin-Mityagin) space"
          source: "ISBN:978-1-4704-2662-5"
    - declaration: "GaussianField.nuclear_bilinear_extension_existsUnique"
      file: "Nuclear/NuclearExtension.lean"
      sorry_count: 0
      literature_dependencies:
        - statement: "bounded bilinear maps factor uniquely through the nuclear tensor product (kernel theorem)"
          source: "ISBN:978-1-4704-2662-5"
    - declaration: "GaussianField.nuclearTensorProduct_mapCLM"
      file: "Nuclear/TensorProductFunctorAxioms.lean"
      sorry_count: 0
      literature_dependencies:
        - statement: "functoriality of the nuclear tensor product (map on morphisms; id/comp laws)"
          source: "ISBN:978-1-4704-2662-5"
    # --- Gaussian measure construction ---
    - declaration: "GaussianField.measure_isGaussian"
      file: "GaussianField/IsGaussian.lean"
      sorry_count: 0
      literature_dependencies:
        - statement: "characteristic functional / Gaussianity of the constructed measure"
          source: "10.1016/0022-1236(73)90025-6"
    - declaration: "GaussianField.support_of_hilbertSchmidt"
      file: "GaussianField/Support.lean"
      sorry_count: 0
      literature_dependencies:
        - statement: "support of a Gaussian measure under Hilbert-Schmidt covariance"
          source: "ISBN:978-0-8218-1054-5"
    - declaration: "GaussianField.hypercontractive_gaussianReal"
