fidelity:
  divergences: >
    Generalized beyond the GFF special case: the construction is
    application-agnostic over any nuclear Frechet space E and any CLM T into any
    separable Hilbert space, rather than specialized to S(R^d) and (-Δ+m^2)^{-1/2}.
    The nuclear tensor product is built concretely via Dynin-Mityagin coordinates
    (rapid-decay sequences) rather than the abstract projective tensor product.

