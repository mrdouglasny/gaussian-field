status:
  scope: >
    Construction of centered Gaussian probability measures on the weak dual E'
    of a nuclear Frechet space E, from a continuous linear map T : E -> H into a
    separable Hilbert space, satisfying the characteristic-functional identity
    E[exp(i<w,f>)] = exp(-||T f||^2 / 2). Includes the Cameron-Martin / Gel'fand
    triple, a support theorem under Hilbert-Schmidt T, and Nelson
    hypercontractivity via log-Sobolev. Lattice + cylinder QFT infrastructure
    for downstream projects (pphi2, OSforGFF).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - embed_l2_uniform_bound                  # Cylinder/MethodOfImages.lean
    - fourierMultiplier_schwartz_bound        # SchwartzFourier/ResolventUniformBound.lean
    - hermiteGalerkinTrunc_tendsto_schwartz   # SchwartzNuclear/HermiteGalerkin.lean
  main_results:
    - declaration: "GaussianField.measure_isGaussian"
      file: "GaussianField/IsGaussian.lean"
      sorry_count: 0
      literature_dependencies:
        - statement: "characteristic functional / Gaussianity of the constructed measure"
          source: "10.1016/0022-1236(73)90025-6"
    - declaration: "GaussianField.support_of_hilbertSchmidt"
