      sorry_count: 0
      literature_dependencies:
        - statement: "Nelson hypercontractive estimate via log-Sobolev"
          source: "10.1016/0022-1236(73)90025-6"
    # --- lattice field theory ---
    - declaration: "GaussianField.fkg_lattice_gaussian"
